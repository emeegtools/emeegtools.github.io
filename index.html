<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1E4A">
<title>EMEEG Online</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<noscript>Turn on JavaScript to use EMEEG Online.</noscript>

<!-- Login -->
<section id="login" class="login" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <img src="icons/logo.png" alt="EMEEG" class="login-logo">
    <h1>EMEEG Online</h1>
    <p class="muted">Kumpra List · End of the Sales</p>
    <label class="field">Username<input class="input" id="lUser" autocomplete="username" autocapitalize="none" required></label>
    <label class="field">Password<input class="input" id="lPass" type="password" autocomplete="current-password" required></label>
    <div class="err" id="lErr" hidden></div>
    <button class="btn primary big" id="lBtn" type="submit">Log in</button>
    <p class="small muted" id="cfgWarn" hidden>This website is not connected yet: <b>config.js</b> has no Supabase link. Save the website files again from EMEEG Sync.</p>
  </form>
</section>

<!-- App -->
<div id="app" class="app" hidden>
  <header class="bar">
    <div class="bar-brand"><img src="icons/icon-192.png" alt=""><div><b id="storeName">EMEEG</b><span id="syncInfo" class="sync-info"></span></div></div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="main" class="main"></main>
  <nav class="bottom" id="bottom"></nav>
</div>

<div class="toast" id="toast" hidden></div>
<dialog id="dlg" class="dlg"></dialog>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
